[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "changelog-upgrade-advisor"
version = "0.1.0"
description = "Local dependency upgrade checklists with resolvable evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["pydantic>=2.14.1,<3"]

[project.optional-dependencies]
sdk = ["openai==3.31.0", "typesafe-sdk==0.7.5"]

[project.scripts]
advisor = "changelog_advisor.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pre-commit>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/changelog_advisor"]

[tool.hatch.build.targets.wheel.force-include]
"node_modules/semver" = "changelog_advisor/node_modules/semver"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
