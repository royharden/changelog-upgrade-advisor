name: offline-bootstrap
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: uv sync --frozen
      - run: npm ci --ignore-scripts
      - run: uv run --frozen --offline ruff check .
      - run: uv run --frozen --offline ruff format --check .
      - run: uv run --frozen --offline pytest tests vendor --junitxml=junit-bootstrap.xml
      - run: uv run --frozen --offline python scripts/demo.py --mode offline --out out/ci-demo
      - name: Installed wheel normal and refusal journeys
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/advisor-wheel" --python 3.12
          uv pip install --python "$RUNNER_TEMP/advisor-wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/advisor-wheel/bin/advisor" demo --out advisor-wheel-normal
          set +e
          "$RUNNER_TEMP/advisor-wheel/bin/advisor" demo --refusal --out advisor-wheel-refusal
          refusal_status=$?
          set -e
          test "$refusal_status" -eq 3
      - run: uv run --frozen --offline python scripts/check_secrets.py --tracked
